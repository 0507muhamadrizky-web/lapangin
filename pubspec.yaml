name: lapangin
description: "Lapangin - Aplikasi Mobile Penyewaan Lapangan Olahraga"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_animations: ^1.1.1
  animations: ^2.0.11
  
  # Navigation
  go_router: ^14.2.7
  
  # Icons
  iconsax: ^0.0.8
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Charts
  fl_chart: ^0.68.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.4.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
