name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flutter build ios --no-codesign akan otomatis:
      # 1. Membuat Podfile jika belum ada
      # 2. Menjalankan pod install
      # 3. Mem-build aplikasi tanpa tanda tangan
      - name: Build iOS (No Codesign)
        run: flutter build ios --no-codesign

      # Mengemas hasil build menjadi file .ipa
      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r lapangin.ipa Payload

      # Mengupload file .ipa agar bisa Anda download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapangin-unsigned-ipa
          path: lapangin.ipa
