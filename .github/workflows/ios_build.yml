name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mem-build aplikasi iOS untuk simulator (tanpa penandatanganan / codesign)
      # Ini adalah cara terbaik untuk mengetes apakah kode Anda aman dari error iOS
      # tanpa perlu memiliki akun Apple Developer berbayar.
      - name: Build iOS (Simulator)
        run: flutter build ios --simulator

      # Jika Anda nantinya memiliki akun Apple Developer dan ingin membuat file .ipa
      # Anda perlu mengatur provisioning profile dan sertifikat.
      # Panduan: https://docs.flutter.dev/deployment/ios
