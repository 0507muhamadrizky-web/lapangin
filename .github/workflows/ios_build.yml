name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1. Biarkan Flutter menyiapkan Podfile, dependensi, dan kode Dart. 
      # Langkah ini mungkin error di akhir karena sertifikat, tapi persiapannya akan selesai.
      - name: Prepare Flutter Build
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      # 2. Kita ambil alih menggunakan mesin kompilasi asli Apple (Xcode) 
      # dan secara paksa mematikan semua pengecekan sertifikat!
      - name: Force Build Unsigned App
        run: |
          cd ios
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/output"

      # 3. Kemas hasil jadinya ke file IPA untuk Sideloadly
      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/output/Runner.app Payload/
          zip -r lapangin.ipa Payload
          echo "File IPA berhasil dibuat dengan isi yang lengkap!"

      # Upload file .ipa agar bisa di-download dari halaman Actions
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapangin-unsigned-ipa
          path: lapangin.ipa
