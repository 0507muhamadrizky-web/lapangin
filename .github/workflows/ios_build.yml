name: iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Mempersiapkan konfigurasi iOS
      - name: Prepare iOS Config
        run: flutter build ios --config-only

      # Mem-build aplikasi menggunakan xcodebuild tanpa tanda tangan (codesign)
      - name: Build Unsigned App
        run: |
          cd ios
          xcodebuild build -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          
      # Mengemas hasil build menjadi file .ipa
      - name: Package into IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r app.ipa Payload

      # Mengupload file .ipa agar bisa Anda download
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapangin-unsigned-ipa
          path: build/ios/iphoneos/app.ipa
