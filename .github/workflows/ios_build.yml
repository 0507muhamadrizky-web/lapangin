name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Xcode build berhasil (48.6s) tapi Flutter menolak karena validasi sertifikat.
      # continue-on-error: true agar proses tidak berhenti di sini.
      # File Runner.app tetap tersimpan meskipun Flutter "gagal".
      - name: Build iOS
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      # Cari file Runner.app yang sudah dibuat oleh xcodebuild, lalu kemas jadi .ipa
      - name: Package into IPA
        run: |
          echo "=== Mencari Runner.app ==="
          find build -name "Runner.app" -type d 2>/dev/null || true

          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_PATH="build/ios/iphoneos/Runner.app"
          else
            APP_PATH=$(find build -name "Runner.app" -type d | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app tidak ditemukan!"
            exit 1
          fi

          echo "Ditemukan: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r lapangin.ipa Payload
          echo "File IPA berhasil dibuat!"

      # Upload file .ipa agar bisa di-download dari halaman Actions
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lapangin-unsigned-ipa
          path: lapangin.ipa
